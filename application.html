<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMRC — Graph Theory in Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="application.css">
</head>
<body>
    <div class="app-page">
        <header class="app-header">
            <a href="index.html" class="back-link">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Lessons
            </a>
            <div class="header-center">
                <h1 class="header-title">Delhi Metro Rail Corporation</h1>
                <p class="header-sub">Graph Theory in Real-World Transit Networks</p>
            </div>
            <span class="header-badge">APPLICATION</span>
        </header>

        <div class="app-body">
            <aside class="sidebar-panel" id="sidebarPanel">

                <div class="control-card">
                    <h3 class="card-heading">Route Finder</h3>
                    <div class="select-row">
                        <label>From</label>
                        <select id="sourceSelect"><option value="">— choose station —</option></select>
                    </div>
                    <div class="select-row">
                        <label>To</label>
                        <select id="destSelect"><option value="">— choose station —</option></select>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-primary" id="findPathBtn">Find Shortest Path</button>
                        <button class="btn btn-outline" id="resetBtn">Reset</button>
                    </div>
                    <button class="btn btn-ghost" id="randomBtn">Random Route</button>
                    <p class="hint-text">Click stations on the map to select them</p>
                </div>

                <div class="control-card" id="pathCard" style="display:none;">
                    <h3 class="card-heading">Path Found</h3>
                    <div id="pathOutput"></div>
                </div>

                <div class="control-card" id="analysisCard" style="display:none;">
                    <h3 class="card-heading">Graph Analysis</h3>
                    <div id="analysisOutput"></div>
                </div>

                <div class="control-card">
                    <h3 class="card-heading">Network Properties</h3>
                    <div class="props-grid" id="propsGrid"></div>
                    <div class="detected-props" id="detectedProps"></div>
                </div>

                <div class="control-card">
                    <h3 class="card-heading">Graph Concepts Demonstrated</h3>
                    <div class="concepts-list" id="conceptsList"></div>
                </div>

            </aside>

            <main class="map-area">
                <div class="map-wrap" id="mapWrap">
                    <svg id="metroMap" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
                        <defs>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="3" result="blur"/>
                                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                            </filter>
                        </defs>
                        <g id="edgesG"></g>
                        <g id="pathG"></g>
                        <g id="nodesG"></g>
                        <g id="legendG" transform="translate(20,485)"></g>
                    </svg>
                </div>
                <div class="station-info" id="stationInfo">
                    <span class="info-empty">Hover over a station to see details · Click to select</span>
                </div>
            </main>
        </div>
    </div>
    <script src="application.js"></script>
</body>
</html>
